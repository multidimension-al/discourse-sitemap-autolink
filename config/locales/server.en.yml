en:
  site_settings:
    gbfans_autolink_enabled: "Enable GBFans automatic internal linking (server-side, applied during post cooking)."
    gbfans_autolink_test_mappings: "Manual phrase mappings, one per entry as 'phrase,url,type'. Used for testing and migration; these rank as manual overrides."
    gbfans_autolink_max_links_per_destination_per_post: "How many times each destination URL may be auto-linked within a single post (first occurrences win). 0 = unlimited."
    gbfans_autolink_max_links_per_post: "Total automatic links allowed per post across all destinations. 0 = unlimited."
    gbfans_autolink_skip_quotes: "Do not auto-link inside quoted material (aside.quote and blockquote elements)."
    gbfans_autolink_include_private_messages: "Also apply automatic linking in private messages."
    gbfans_autolink_excluded_categories: "Never auto-link posts in these categories (subcategories are excluded too). Use for marketplace/for-sale areas where members' own listings should not gain shop links."
    gbfans_autolink_base_url: "Origin prepended to relative catalog URLs when generating links."
    gbfans_autolink_sitemap_base_url: "Base URL the catalog sync fetches sitemaps and pages from."
    gbfans_autolink_sources: "Child sitemaps to ingest, one per entry as 'path,content_type'."
    gbfans_autolink_enabled_types: "Content types allowed to generate links. Keep wiki out until its catalog slice has been reviewed."
    gbfans_autolink_type_priority: "Deterministic priority order for alias collisions, strongest first."
    gbfans_autolink_min_phrase_length: "Generated phrases shorter than this go to review instead of activating."
    gbfans_autolink_min_wiki_words: "Generated wiki phrases with fewer words than this go to review (letter+digit names like Ecto-1 are exempt)."
    gbfans_autolink_excluded_terms: "Phrases that must never be auto-generated as link terms. Manual aliases override this list."
    gbfans_autolink_daily_sync_enabled: "Run the daily sitemap-to-catalog synchronization job."
    gbfans_autolink_auto_rebake_on_changes: "After a sync, enqueue selective rebakes of posts likely affected by added/removed phrases."
    gbfans_autolink_max_rebakes_per_job_run: "Batch size for selective rebake jobs; larger changes continue in follow-up jobs one minute apart."
    gbfans_autolink_analytics_enabled: "Send internal_auto_link_click events to GA4 (gtag or dataLayer) when generated links are clicked."
