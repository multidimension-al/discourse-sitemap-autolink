en:
  site_settings:
    sitemap_autolink_enabled: "Enable automatic internal linking (server-side, applied during post cooking)."
    sitemap_autolink_sources: "Sitemaps to ingest, one per entry as 'https://example.com/sitemap.xml,content_type'. Sitemap indexes are expanded automatically; the content type labels every URL from that source (e.g. product, wiki, docs)."
    sitemap_autolink_manual_mappings: "Manual phrase mappings, one per entry as 'phrase,url,type'. These rank as manual overrides. Relative URLs resolve against this forum's origin."
    sitemap_autolink_max_links_per_destination_per_post: "How many times each destination URL may be auto-linked within a single post (first occurrences win). 0 = unlimited."
    sitemap_autolink_max_links_per_post: "Total automatic links allowed per post across all destinations. 0 = unlimited."
    sitemap_autolink_skip_quotes: "Do not auto-link inside quoted material (aside.quote and blockquote elements)."
    sitemap_autolink_include_private_messages: "Also apply automatic linking in private messages."
    sitemap_autolink_excluded_categories: "Never auto-link posts in these categories (subcategories are excluded too). Use for marketplace/for-sale areas where members' own listings should not gain links."
    sitemap_autolink_enabled_types: "Content types allowed to create links. Leave empty to allow every configured type; list types to restrict (e.g. hold a large wiki back until its terms are reviewed)."
    sitemap_autolink_type_priority: "Deterministic priority order for phrase collisions, strongest first. 'manual' covers manual mappings and admin-added aliases; unlisted types rank last."
    sitemap_autolink_min_phrase_length: "Generated phrases shorter than this many characters go to review instead of activating."
    sitemap_autolink_min_phrase_words: "Generated phrases with fewer words than this go to review (model-number style tokens containing letters and digits are exempt)."
    sitemap_autolink_generate_plurals: "Also generate simple plural variants of titles as matching phrases."
    sitemap_autolink_title_suffixes: "Suffixes stripped from the end of fetched page titles, one per entry (e.g. ' - Example Shop', ' | Example.com')."
    sitemap_autolink_excluded_url_patterns: "Sitemap URLs matching any of these patterns are never ingested. Plain text matches as a substring; use * as a wildcard (e.g. '*/checkout*', 'https://example.com/tag/*')."
    sitemap_autolink_excluded_terms: "Phrases that must never be auto-generated as link terms. Manual aliases override this list."
    sitemap_autolink_sync_enabled: "Run the daily sitemap-to-catalog synchronization job."
    sitemap_autolink_auto_rebake_on_changes: "After a sync, rebake posts likely affected by added/removed phrases — one batched background job per sync, bounded by the two settings below."
    sitemap_autolink_auto_rebake_max_phrases: "If a single sync changes MORE phrases than this, skip the automatic rebake entirely (an initial catalog import would otherwise trigger a near-full-forum rebake). Affected posts still pick up links when next edited or rebaked."
    sitemap_autolink_auto_rebake_max_posts: "Most posts one sync's automatic rebake wave may rebake in total. Posts beyond the cap pick up link changes when next edited or rebaked."
    sitemap_autolink_max_rebakes_per_job_run: "Batch size per rebake job run; larger waves continue in follow-up jobs one minute apart."
    sitemap_autolink_analytics_enabled: "Send internal_auto_link_click events to Google Analytics (gtag or dataLayer, whichever exists) when generated links are clicked."
